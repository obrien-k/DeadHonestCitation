[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
# A pragmatic set: pyflakes (F), pycodestyle errors (E) + warnings (W),
# isort (I), pyupgrade (UP), flake8-bugbear (B), and flake8-comprehensions (C4).
select = ["F", "E", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
]

[tool.ruff.format]
quote-style = "double"
